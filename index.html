	<script>
		app_prefix = 'hypermark_reloaded_'
		let cur_item = {};
		let is_saved = false;
		let savedStuff = [];

		pref_key = 'cdt_mdvonverter';

		let pref_saved = `${pref_key}_savedstuff`;
		let renderpost_inter = undefined;
		let autosave_inter = undefined;
		let autosave_enabled = true;
		let autosave_intervals = 12000;

		window['dontlog'] = true;

		input.addEventListener('input',(e) => {
			renderStuff();
		})

		// text processing and UI ops
			const renderStuff = () => {
				let outxt = input.value;
				let outht = ``;

				outht = marked.parse(outxt);
				output.innerHTML = outht;

				clearTimeout(renderpost_inter);

				renderpost_inter = setTimeout(() => {
					postprocess();
				},1200);
			}
			const postprocess = () => {
				// let item = output;

				// postprocess for code tags
				let codes = output.querySelectorAll('pre>code');
				codes.forEach((c,n) => {
					c.id = "code_" + n;

					let pr = c.parentElement;
					let pd = mekDiv(c.className.replaceAll('language-',''),'code_label');
					let btnht = mekButton({caption: 'copy code', btype: 'outline', icon: 'fa-copy', _class: 'sm slide-up', _props: `data-copythis="#${c.id}"`});
					let conht = mekDiv(pd + btnht, 'spacy-tn flowline spread panelbg modetxt code_opts');

					pr.innerHTML = conht + pr.innerHTML;
				});

				let anchors = output.querySelectorAll('a');
				anchors.forEach(a => {
					a.target = 'blank';
				})
				refreshUI(300);
			}
			window['switchmytab'] = (el) => {
				// return;
				let tabs = document.querySelectorAll('.pagepart');
				let btns = document.querySelectorAll('.tabbtn');
				let n = Number(el.dataset.myid);
				let hydclass = 'w3-hide-small';

				tabs.forEach(t => {
					t.classList.add(hydclass);
				});

				// return;

				btns.forEach(t => {
					t.classList.remove('active');
				});

				tabs[n].classList.remove(hydclass);
				btns[n].classList.add('active');
			}

		// initialisers
			window['initstuff'] = () => {
				savedStuff = getsaved();
				_startup();
			}
			window['_restart_autosaver'] = () => {
				alert_silent('restarting autosaver');
				clearTimeout(autosave_inter);

				autosave_inter = setTimeout(() => {
					run_autosave();
				}, autosave_intervals);
			}

		// autosave algo
			function run_autosave() {
				if(!autosave_enabled){
					return;
				} else {
					_restart_autosaver();
				}

				// alert_info('saving');
				// return;

				let v = input.value;

				if(v == '' && cur_project == undefined){
					// alert_warning('nothing to save');
					return;
				}

				let outdata = {
					text: v,
				}
				m_autosave.setData(outdata);

				// alert_danger('here yet?');
				alert_success('draft saved');
				// _restart_autosaver();
			}
			function toggle_autosave() {
				autosave_enabled = !autosave_enabled;

				if(!autosave_enabled){
					clearTimeout(autosave_inter);
				} else {
					_restart_autosaver();
				}
			}

		// download options
			window['export_project'] = (el) => {
				let outht = '';
				let cms = {
					"btype": "outline",
					_class: "sm_"
				}

				outht += mekButton({
					...cms,
					"caption": "download HTML",
					_props: 'data-runme="downloadHTML"',
				});

				outht += mekButton({
					...cms,
					"caption": "download Markdown",
					_props: 'data-runme="downloadMd"',
				});

				outht += mekButton({
					...cms,
					"caption": "download Text",
					_props: 'data-runme="downloadText"',
				});

				outht = mekDiv(outht, 'flowline overflow gap-sm left');

				mekModal(
					{
						title: 'Saved documents',
						sub: 'here are the saved documents',
						size: 'md',
						has_continue: false,
						content: outht,
					}
				);
			}
			window['downloadHTML'] = (el) => {
				alert_info('downloading your text');
				let mdata = output.innerHTML;

				if(inputEmpty()){
					alert_danger('nothing to save');
					return;
				}

				let mfile = new Blob([mdata],{type: 'application/html'});
				let url = URL.createObjectURL(mfile);

				let a = document.createElement('a');
				a.href = url;
				a.download = 'parsed_markdown.html';

				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
			}
			window['downloadText'] = (el) => {
				alert_info('downloading your text');

				let mdata = input.value;

				if(mdata==''){
					alert_danger('nothing to save');
					return;
				}

				let mfile = new Blob([mdata],{type: 'text/plain'});
				let url = URL.createObjectURL(mfile);

				let a = document.createElement('a');
				a.href = url;
				a.download = 'downloaded_text.txt';

				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
			}
			window['downloadMd'] = (el) => {
				alert_info('downloading your text');

				let mdata = input.value;

				if(mdata==''){
					alert_danger('nothing to save');
					return;
				}

				let mfile = new Blob([mdata],{type: 'application/markdown'});
				let url = URL.createObjectURL(mfile);

				let a = document.createElement('a');
				a.href = url;
				a.download = 'downloaded_markdown.md';

				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
			}

		// save options
			window['saveCurrentWirk'] = (el) => {
				if(inputEmpty() && cur_project == undefined){
					alert_danger('cant save an empty text');
					return;
				}

				let now = new Date();
				let tosave = {
					data: input.value,
				}
				is_saved = !(cur_project == undefined);

				if(is_saved){
					alert_info('updating item');

					cur_project = {
						...cur_project,
						data: input.value,
						updated_at: now.toISOString(),
					};
					m_saved_stuff.update(cur_project);
					after_fx(rec);
				} else {
					tosave.created_at = now.toISOString();
					alert_info('adding to saved');

					// awaitprompt('Save the document as...',savenew);
					let inputs = [
						{
							typ: 'text',
							field: 'project_name',
							label: 'document name',
							required: true,
						}
					];
					get_input('Save the document as...',inputs,savenew);
				}

				function savenew(n){
					alert_info(`saving: ${n.project_name}`);
					// return;
					tosave.title = n.project_name;
					console.log('saving as', tosave);

					let rec = m_saved_stuff.add_one(tosave);
					after_fx(rec);
					// saveToLocal(tosave,is_saved);
				}

				function after_fx(r) {
					cur_project = r;
					m_cur_project.setData(r);
					renderProjectInfo();
				}

				function updateone() {
					alert_info(`updating: ${cur_item.title}`)
					saveToLocal(tosave,is_saved);
				}
			}
			window['saveToLocal'] = (s,to_update = false) => {
				savedStuff = getsaved();

				if(to_update){
					// 
				} else {
					let sve = {...s};
					sve.id = savedStuff.length;
					savedStuff.push(sve);
				}

				setsaved();
			}

			window['checksaved'] = (el) => {
				// 
			}
			window['getsaved'] = () => {
				let tt = localStorage.getItem(pref_saved);
				if(tt == '' || tt == null){
					return [];
				}

				return JSON.parse(tt);
			}
			window['setsaved'] = () => {
				localStorage.setItem(pref_saved,JSON.stringify(savedStuff));
				let tt = localStorage.getItem(pref_saved);
				return JSON.parse(tt);
			}

		// drop options
			window['start_over'] = () => {
				// this clears the draft save and the current project
				const doit = () => {
					m_autosave.delete();
					m_cur_project.delete();
					window.location.reload();
				}

				confirmAction('Start Over?', 'this will clear all drafts and will forget the current project<br>Are you sure?',() => {doit()})
			}
			window['view_saved'] = () => {
				let outht = '';
				let stuff = m_saved_stuff.data == undefined ? [] : m_saved_stuff.data;

				if(stuff == 0){
					outht = mekStandin(
							mekDiv('no items saved yet' + 
							mekButton({caption: 'add new',icon: 'fa fa-plus',_props: 'data-runme="saveCurrentWirk"',btype: 'primary'}))
						);
				}

				stuff.forEach(s => {
					outht += `
						<div class="project_card" data-runme="pick_project" data-recid="${s.recid}" data-dismiss="modal">
							<div class="details"><b>${s.title}</b></div>
							<div class="metadata flowline gap-sm left" style="opacity: 0.6; font-size: 0.7rem">
								<span>added: ${mekTag('small',formatDate0(s.created_at),'text-muted')}</span>
								<span>updated: ${mekTag('small',formatDate0(s.updated_at),'text-muted')}</span>
							</div>
						</div>
					`;
				})

				mekModal(
					{
						title: 'Saved documents',
						sub: 'here are the saved documents',
						size: 'md',
						has_continue: false,
						content: outht,
					}
				);
			}
			window['pick_project'] = (el) => {
				let mine = m_saved_stuff.find(el.dataset.recid);
				console.log('data', mine);

				m_cur_project.setData(mine);
				m_autosave.delete();
				cur_project = mine;
				renderProjectInfo();

				input.value = mine.data;
				renderStuff();
				_restart_autosaver();
			}

		// utilities
			function inputEmpty() {
				return input.value == '';
			}
			function awaitprompt(title='enter info', calback) {
				const modalsel = '#promptModal';
				const mdl = document.querySelector(modalsel);
				const entered = mdl.querySelector('#promptInput');
				const p_title = mdl.querySelector('#promptTitle');

				mdl.dataset.shown = "1";
				mdl.style.display = "flex";
				p_title.innerHTML = title;

				let clb = () => {
					toggleShow('#promptModal');
					alert_warning('no calback defined for prompt modal');

					window['promptModalCallback'] = () => {
						alert_warning('no calback defined for prompt modal');
					}
				}

				if(typeof calback == 'function'){
					clb = () => {
						if(entered.value == ''){
							alert_danger('type something first');
							return;
						}
						toggleShow(modalsel);
						calback(entered.value);

						window['promptModalCallback'] = () => {
							alert_warning('no calback defined for prompt modal');
						}
					};
				}

				window['promptModalCallback'] = clb;
			}
			window['promptModalCallback'] = () => {
				alert_warning('no calback defined for prompt modal');
			}

		callOnLoad.push({act: initstuff});
	</script>

	<script>
		let pref_draft = `${app_prefix}last_draft`;
		let pref_project = `${app_prefix}cur_project`;

		let draft = undefined;
		let cur_project = undefined;

		class _savehelper {
			// utilities can be called from anywhere
				static family = new Set();
				static updateAll(){
					let fam = _savehelper.family;
					/*
					for(const item in fam){
						// loop style 1
					}
					// */

					fam.forEach((f,v,all) => {
						f.refreshData();
					})
				}
				static getItem(pref,preparse=false){
					let d = localStorage.getItem(pref);
					return _savehelper.preparse_items(d,preparse);
				}
				static getItem_Flash(pref, preparse){
					let d = sessionStorage.getItem(pref);
					return _savehelper.preparse_items(d,preparse);
				}
				static preparse_items(d,doit = false){
					if(!doit){
						return d;
					}

					try{
						d = JSON.parse(d);
					} catch(err) {
						console.error(err);
						return undefined;
					}

					return d;
				}
				static pre_process(wot){
					if(typeof wot == 'string'){
						return wot;
					}

					let outp = null;

					try{
						outp = JSON.stringify(wot);
					} catch(err) {
						console.error(err);
						return null;
					}

					return outp;
				}
				static setItem(pref,con = undefined, preparse = false){
					let tosave = _sh.pre_process(con);
					localStorage.setItem(pref, tosave);
					return _savehelper.getItem(pref);
				}
				static setItem_Flash(pref,con = undefined, preparse = false){
					let tosave = _sh.pre_process(con);
					sessionStorage.setItem(pref, tosave);
					return _savehelper.getItem_Flash(pref);
				}

			// identity data
				serial = '--xx--';
				name = 'no name';
				born_at = undefined;
				config = undefined;
				defaultConfig = {
					primaryKey: 'recid',
					engine: 'localStorage',		// where the data will be saved
					use_prefix: true,			// if it should add the app_prefix or not
					pref: 'default_pref',		// the storage key
					multiple: true,			// for things with more than one record
					autoload: true,				// should it get the data automatically when loaded
				};
				data = undefined;

			// runtime data
				said = [];
				mylogs = [];

			// main methods
				constructor(config = {}) {
					_savehelper.family.add(this);
					let dft = this.defaultConfig;
					let cfg = {...dft, ...config};

					// do some post processing on the data
					if(config != undefined){
						if(typeof config.pref == 'string' && cfg.use_prefix){
							cfg.pref = `${app_prefix}${cfg.pref}`;
						}
					}

					this.serial = mekRandomString(7);
					this.born_at = new Date();
					this.name = cfg.name;
					this.is_multiple = cfg.multiple;

					this.config = cfg;

					if(cfg.autoload){
						this.getData();
					}
				}

				say = (wot, inform = false) => {
					this.said.push({words: wot, when: (new Date()).toISOString()});

					if(inform){
						alert_info(`[${this.name}] ${wot}`,8);
					}
				}
				logme = (wot) => {
					let n = {
						created_at: (new Date()).toISOString(),
						content: wot,
					};

					this.mylogs.push(n);
				}
				refreshData = () => {
					this.say('refreshing data',1==1);
					this.getData();
				}

			// data ops
				getData = () => {
					let cfg = this.config;
					let data = undefined;

					if(cfg.engine.toLowerCase() == 'localstorage'){
						data = _sh.getItem(cfg.pref,true);
					} else {
						data = _sh.getItem_Flash(cfg.pref,true)
					}

					this.data = data;
					return this;
				}
				setData = (dta) => {
					let cfg = this.config;
					let data = this.data;
					let nowstring = (new Date()).toISOString();

					this.say('starting save process');
					// console.log(`saving ${cfg.name}`,cfg);

					if(!cfg.multiple){
						// assumes you passed an object
						// let dft = {};

						if(data == undefined){
							dta.created_at = nowstring;
						}

						dta.updated_at = nowstring;
					}

					this.data = dta;
					this.say('saving data');
					this.saveDataRaw();

					return this;
				}
				saveDataRaw = () => {
					let cfg = this.config;
					let data = this.data;
					data = data == undefined ? null : data;

					// console.log(`saving raw ${cfg.name}`,cfg);

					if(cfg.engine.toLowerCase() == 'localstorage'){
						this.say('saving to local');
						_sh.setItem(cfg.pref,data);
					} else {
						this.say('saving to session');
						_sh.setItem_Flash(cfg.pref,data);
					}
				}

				find_my_id = (rec) => {
					let data = this.data || [];
					let recid = undefined;
					let primaryKey = this.config.primaryKey;
					let keyval = typeof rec == 'string' ? rec : rec[primaryKey];

					data.forEach((d,id) => {
						if(d[primaryKey] == keyval){
							recid = id;
						}
					});

					return recid;
				}
				find = (val) => {
					let data = this.data || [];
					let primaryKey = this.config.primaryKey;
					let found = undefined;

					// console.log('all data',data)

					data.forEach((d,id) => {
						let v = d[primaryKey];
						// console.log(`this: ${v}, wanted: ${val}`);
						if(d[primaryKey] == val){
							found = d;
						}
					});

					return found;
				}

				add_one = (rec) => {
					let cfg = this.config;
					let data = this.data;
					let nowstring = (new Date()).toISOString();

					if(!(cfg.multiple)){
						this.say('you can only add to an item with multiple entries',true);
						return;
					}

					rec[cfg.primaryKey] = mekRandomString(12);
					rec.created_at = nowstring;
					rec.updated_at = nowstring;

					if(data == undefined){
						data = [];
					}

					data.push(rec);

					this.data = data;
					this.saveDataRaw();

					return rec;
				}

				update = (rec) => {
					let cfg = this.config;
					let data = this.data;
					let nowstring = (new Date()).toISOString();
					rec.updated_at = nowstring;

					if(!cfg.multiple){
						data = rec;
					} else {
						let recid = this.find_my_id(rec);

						if(recid == undefined){
							this.say('invalid record id', true);
						} else {
							data[recid] = rec;
						}
					}

					this.data = data;
					this.saveDataRaw();

					return rec;
				}
				delete = (keyval) => {
					let cfg = this.config;
					let data = this.data;
					let nowstring = (new Date()).toISOString();

					if(!cfg.multiple){
						// rec.updated_at = nowstring;
						data = null;
					} else {
						let recid = this.find_my_id(keyval);

						if(recid == undefined){
							this.say('invalid record id', true);
						} else {
							// data[recid] = rec;
							data = [...data].toSpliced(recid,1);
						}
					}

					this.data = data;
					this.saveDataRaw();
				}
		}
		class _sh extends _savehelper{
			constructor(cfg){
				cfg.source = "shortener";
				super(cfg);
			}
		}

		// data models
		let m_saved_stuff = new _sh({
			name: 'saved_projects',
			pref: 'saved_markdown_projects',
		});
		let m_cur_project = new _savehelper({
			name: 'current project',
			use_prefix: false,
			pref: pref_project,
			multiple: false,
		});
		let m_autosave = new _sh({
			name: 'autosave',
			pref: pref_draft,
			use_prefix: false,
			multiple: false,
		});

		function _startup(argument) {
			let d_draft = undefined;
			let d_project = undefined;

			// check for autosave
			const check_draft = () => {
				d_draft = m_autosave.getData().data;

				if(d_draft != undefined){
					alert_info('nope');
					let msg = "we found a draft, do you want to continue with it";
					confirmAction('Draft found',msg,load_draft);
				} else {
					alert_info('no draft found');
					_restart_autosaver();
				}
			};
			const load_draft = () => {
				alert_info('loading draft');
				draft = d_draft;

				input.value = draft.text;
				renderStuff();
				_restart_autosaver();
			};

			// check for current project
			const check_project = () => {
				alert_info('checking project');
				d_project = m_cur_project.getData().data;
				console.log('project data',d_project);

				if(d_project == undefined){
					alert_dark('project not found');
				} else {
					alert_dark('project found');
					cur_project = d_project;
				}

				renderProjectInfo();
			}

			check_draft();
			check_project();
		}

		function renderProjectInfo() {
			let ui_projects = document.querySelectorAll('[data-role="project-card"]');
			let proj = cur_project;

			ui_projects.forEach((ui,n) => {
				let inner = ui.querySelector('[data-subrole="inner"]');
				let contents = '';
				inner = inner == undefined ? ui : inner;

				if(proj == undefined){
					contents = mekDiv(mekTag('i','no document selected'),'text-muted');
				} else {
					contents = `
						${mekDiv(proj.title,'text-bold')}
						${mekTag('small',proj.recid,'text-muted')}
					`;
				}

				inner.innerHTML = mekDiv(contents,"flow");
			});

			if(proj != undefined){
				input.value = proj.data;
				renderStuff();
			}
		}
	</script>
