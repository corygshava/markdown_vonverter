<body class="flow_body" data-mode="dark">
	<div class="w3-bottom w3-display-bottomright" style="width: auto;">
		<button class="btn circle_btn" data-myclass="btn circle_btn" data-runme="toggle_ui_mode" id="mode_indicator"><i class="fa fa-plus"></i></button>
	</div>
	<nav class="navbar flowline spread scrolled">
		<div class="inner">
			<div class="flowline gap-sm">
				<div class="centroid">
					<b class="themegrad spacy-tn themeround sq w3-text-black">Md</b>
				</div>
				<br data-visibledata="1,0,0">
				<div>
					<span style="display: block;"><b>_HyperMark</b></span>
					<small>markdown vonverter</small>
				</div>
			</div>

			<div id="sitelinks"></div>

			<div data-visibledata="0,1,1" id="app_options" class="navops drop-hover w3-hide">
				<button class="w3-red_">options <i class="fa fa-caret-down"></i></button>
				<div class="dropguy w3-animate-opacity panelbg">
					<button class="dropdown-item" data-runme="downloadHTML">
						<i class="fa fa-download"></i>
						Download HTML
					</button>
					<button class="dropdown-item" data-runme="downloadText">
						<i class="fa fa-file-alt"></i>
						Download Text
					</button>
					<button class="dropdown-item" data-runme="downloadMd">
						<i class="fa fa-file-alt"></i>
						Download .Md
					</button>
					<button class="dropdown-item" data-runme="saveToStorage">
						<i class="fa fa-save"></i>
						Save
					</button>
					<button class="dropdown-item" data-runme="checksaved">
						<i class="fa fa-folder-open"></i>
						Saved documents
					</button>
				</div>
			</div>

			<div data-visibledata="1,1,1">
				<div class="dropdown">
					<button class="toolbtn" id="userOpsDropper" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
						<span class="">Options</span>
						<i class="fa fa-caret-down"></i>
					</button>
					<div class="dropdown-menu dropdown-menu-right slide-down dropmenu panelbg" style="margin-top: 12px;border: none;" data-copyme="#app_options>.dropguy">
						this is dropped
					</div>
				</div>
			</div>
		</div>
	</nav>

	<div class="writeArea">
		<div class="pagepart w3-animate-opacity inputarea">
			<textarea placeholder="enter markdown here" id="input"></textarea>
		</div>
		<div id="divider" data-visibledata="0,1,1"></div>
		<div class="pagepart w3-animate-opacity outputarea" data-visibledata="0,1,1">
			<div id="output" class="spacy-sm in_fullwidth markdown-body" data-theme="solar_">
				processed html is shown here
			</div>
		</div>
	</div>

	<div class="mobile-tabs" data-visibledata="1,0,0">
		<div class="tabs">
			<button class="tabbtn active" data-runme="switchmytab" data-myid="0" aria-expanded="false">
				<span class="">writer</span>
			</button>
			<button class="tabbtn" data-runme="switchmytab" data-myid="1" aria-expanded="false">
				<span class="">Output</span>
			</button>
		</div>
	</div>

	<div class="w3-hide">
		<div class="mdl" id="promptModal" data-shown="0">
			<div class="modal-content slide-up">
				<h4 id="promptTitle">Set Balance</h4>
				<input id="promptInput" type="text" step="0.01" placeholder="0.00">
				<div class="modal-actions">
					<button class="except mybtn themeround primary" data-runme="promptModalCallback">Save</button>
					<button class="except mybtn themeround outline-primary" data-toggler="#promptModal">Cancel</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		let cur_item = {};
		let is_saved = false;
		let savedStuff = [];

		pref_key = 'cdt_mdvonverter';

		let pref_saved = `${pref_key}_savedstuff`;
		let renderpost_inter = undefined;

		window['dontlog'] = true;

		input.addEventListener('input',(e) => {
			renderStuff();
		})

		const renderStuff = () => {
			let outxt = input.value;
			let outht = ``;

			outht = marked.parse(outxt);
			output.innerHTML = outht;

			clearTimeout(renderpost_inter);

			renderpost_inter = setTimeout(() => {
				postprocess();
			},1200);
		}

		const postprocess = () => {
			// let item = output;

			// postprocess for code tags
			let codes = output.querySelectorAll('pre>code');
			codes.forEach((c,n) => {
				c.id = "code_" + n;

				let pr = c.parentElement;
				let pd = mekDiv(c.className.replaceAll('language-',''),'code_label');
				let btnht = mekButton({caption: 'copy code',btype: 'outline',icon: 'fa-copy',_class: 'sm slide-up',_props: `data-copythis="#${c.id}"`});
				let conht = mekDiv(pd + btnht, 'spacy-tn w3-display-bottomright w3-bottom flowline spread panelbg modetxt');

				pr.innerHTML = pr.innerHTML + conht;
			});

			refreshUI(300);
		}

		window['switchmytab'] = (el) => {
			// return;
			let tabs = document.querySelectorAll('.pagepart');
			let btns = document.querySelectorAll('.tabbtn');
			let n = Number(el.dataset.myid);
			let hydclass = 'w3-hide-small';

			tabs.forEach(t => {
				t.classList.add(hydclass);
			});

			// return;

			btns.forEach(t => {
				t.classList.remove('active');
			});

			tabs[n].classList.remove(hydclass);
			btns[n].classList.add('active');
		}

		// initialisers
			window['initstuff'] = () => {
				savedStuff = getsaved();
			}

		// download options
			window['downloadHTML'] = (el) => {
				alert_info('downloading your text');

				let mdata = output.innerHTML;

				if(inputEmpty()){
					alert_danger('nothing to save');
					return;
				}

				let mfile = new Blob([mdata],{type: 'application/html'});
				let url = URL.createObjectURL(mfile);

				let a = document.createElement('a');
				a.href = url;
				a.download = 'parsed_markdown.html';

				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
			}
			window['downloadText'] = (el) => {
				alert_info('downloading your text');

				let mdata = input.value;

				if(mdata==''){
					alert_danger('nothing to save');
					return;
				}

				let mfile = new Blob([mdata],{type: 'text/plain'});
				let url = URL.createObjectURL(mfile);

				let a = document.createElement('a');
				a.href = url;
				a.download = 'downloaded_text.txt';

				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
			}
			window['downloadMd'] = (el) => {
				alert_info('downloading your text');

				let mdata = input.value;

				if(mdata==''){
					alert_danger('nothing to save');
					return;
				}

				let mfile = new Blob([mdata],{type: 'application/markdown'});
				let url = URL.createObjectURL(mfile);

				let a = document.createElement('a');
				a.href = url;
				a.download = 'downloaded_markdown.md';

				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
			}

		// save options
			window['saveToStorage'] = (el) => {
				if(inputEmpty()){
					alert_danger('cant save an empty text');
					return;
				}

				let now = new Date();
				let tosave = {
					date_added : now.toLocaleString(),
					data: input.value,
				}

				if(is_saved){
					alert_info('updating item');
					cur_item = {
						...cur_item,
						date_modified: now.toLocaleString(),
						data: input.value,
					};
					updateone();
				} else {
					alert_info('adding to saved');

					awaitprompt('Save the document as...',savenew);
				}

				function savenew(n){
					alert_info(`saving: ${n}`);
					tosave.title = n;
					saveToLocal(tosave,is_saved);
				}

				function updateone() {
					alert_info(`updating: ${cur_item.title}`)
					saveToLocal(tosave,is_saved);
				}
			}
			window['saveToLocal'] = (s,to_update = false) => {
				savedStuff = getsaved();

				if(to_update){
					// 
				} else {
					let sve = {...s};
					sve.id = savedStuff.length;
					savedStuff.push(sve);
				}

				setsaved();
			}

			window['checksaved'] = (el) => {
				// 
			}
			window['getsaved'] = () => {
				let tt = localStorage.getItem(pref_saved);
				if(tt == '' || tt == null){
					return [];
				}

				return JSON.parse(tt);
			}
			window['setsaved'] = () => {
				localStorage.setItem(pref_saved,JSON.stringify(savedStuff));
				let tt = localStorage.getItem(pref_saved);
				return JSON.parse(tt);
			}

		// utilities
			function inputEmpty() {
				return input.value == '';
			}
			function awaitprompt(title='enter info', calback) {
				const modalsel = '#promptModal';
				const mdl = document.querySelector(modalsel);
				const entered = mdl.querySelector('#promptInput');
				const p_title = mdl.querySelector('#promptTitle');

				mdl.dataset.shown = "1";
				mdl.style.display = "flex";
				p_title.innerHTML = title;

				let clb = () => {
					toggleShow('#promptModal');
					alert_warning('no calback defined for prompt modal');

					window['promptModalCallback'] = () => {
						alert_warning('no calback defined for prompt modal');
					}
				}

				if(typeof calback == 'function'){
					clb = () => {
						if(entered.value == ''){
							alert_danger('type something first');
							return;
						}
						toggleShow(modalsel);
						calback(entered.value);

						window['promptModalCallback'] = () => {
							alert_warning('no calback defined for prompt modal');
						}
					};
				}

				window['promptModalCallback'] = clb;
			}
			window['promptModalCallback'] = () => {
				alert_warning('no calback defined for prompt modal');
			}

		callOnLoad.push({act: initstuff});
	</script>
</body>
